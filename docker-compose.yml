services:
  frontend:
    build: ./frontend
    ports:
      - "443:443"
    depends_on:
      - backend
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    volumes:
      - ./Backend/auth/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    networks:
      - app-network

  backend:
    build: ./Backend/app
    ports:
      - "1000:8000"
    environment:
      BACKEND_ETL_SERVICE_URL: http://etl:8000
      BACKEND_ML_SERVICE_URL: http://ml:8000
      BACKEND_KEYCLOAK_URL: http://keycloak:8080
      BACKEND_KEYCLOAK_REALM: transport
      BACKEND_LOG_LEVEL: INFO
      BACKEND_WORKERS: 2
    depends_on:
      - etl
      - keycloak
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 1G

  etl:
    build: ./Backend/etl
    ports:
      - "1010:8000"
    environment:
      ETL_DATABASE_URL: postgresql://etl:etl@db:5432/transport
      ETL_YANDEX_WEATHER_API_KEY: ${YANDEX_WEATHER_API_KEY}
      ETL_YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY}
      ETL_MOSRU_API_KEY: ${MOSRU_API_KEY}
      ETL_DATASET_PATH: /app/data/dataset.zip
      ETL_LOG_LEVEL: INFO
    volumes:
      - ./Backend/data:/app/data:ro
    depends_on:
      - db
    networks:
      - app-network

  ml:
    build: ./ml
    ports:
      - "1020:8000"
    environment:
      ML_DATABASE_URL: postgresql://ml:ml@db:5432/transport
      ML_LOG_LEVEL: INFO
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: transport
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./Backend/infra/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "1030:5432"
    networks:
      - app-network

  logs-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: logs
    volumes:
      - logs-data:/var/lib/postgresql/data
    ports:
      - "8000:5432"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./Backend/infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "8010:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./Backend/infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "8020:3000"
    networks:
      - app-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.50.0
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - app-network

volumes:
  db-data:
  logs-data:
  prometheus-data:
  grafana-data:

networks:
  app-network:
    driver: bridge
