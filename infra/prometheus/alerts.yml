groups:
  - name: service_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Сервис {{ $labels.job }} недоступен"
          description: "Prometheus не может собрать метрики более минуты"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокая задержка в {{ $labels.job }}"
          description: "p95 времени ответа превышает 1 с в течение 5 минут"

      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum by (job) (rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Высокая доля ошибок в {{ $labels.job }}"
          description: "Более 5% ответов с кодом 5xx в течение 5 минут"
