global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    stack: mos-transport

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:8010"]

  - job_name: "backend"
    static_configs:
      - targets: ["backend:1000"]
        labels:
          service: backend

  - job_name: "etl"
    static_configs:
      - targets: ["etl:1010"]
        labels:
          service: etl

  - job_name: "ml"
    static_configs:
      - targets: ["ml:1020"]
        labels:
          service: ml
