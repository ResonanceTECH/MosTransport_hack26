services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_MSW: "true"
        VITE_DEMO_AUTH: "true"
    ports:
      - "8080:80"
    environment:
      API_BASE_URL: /api/v1
      KEYCLOAK_URL: ""
      KEYCLOAK_REALM: transport
      KEYCLOAK_CLIENT_ID: web
      USE_MSW: "true"
      DEMO_AUTH: "true"
      GRAFANA_URL: http://localhost:3000
      MAP_STYLE_URL: https://basemaps.cartocdn.com/gl/positron-gl-style/style.json
    # Backend optional — with USE_MSW=true UI works without it.
    # Uncomment when backend service exists:
    # depends_on:
    #   - backend
